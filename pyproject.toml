[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finradar"
version = "0.1.0"
description = "Desktop early warning system for small business financial risks"
readme = "README.md"
requires-python = ">=3.13,<3.14"

dependencies = [
    "finradar-contracts==0.1.0",
    "PySide6==6.11.1",
    "SQLAlchemy>=2.0,<3.0",
    "alembic>=1.15,<2.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "platformdirs>=4.3,<5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "pytest-qt>=4,<5",
    "ruff>=0.9,<1",
]

[project.scripts]
finradar = "finradar.main:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["finradar", "finradar.*"]

[tool.setuptools.package-data]
finradar = ["demo/scenarios/*.json"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
    ".",
    "src",
    "packages/contracts/src",
    "packages/monitor/src",
]
