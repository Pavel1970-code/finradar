[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "finradar-contracts"
version = "0.1.0"
description = "Neutral public data contracts for FinRadar trust boundaries"
readme = "README.md"
requires-python = ">=3.13,<3.14"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["finradar_contracts", "finradar_contracts.*"]
